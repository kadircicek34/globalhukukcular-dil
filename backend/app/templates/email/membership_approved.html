<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;background:#081226;font-family:Arial,sans-serif;color:#0f1e3d;">
    <div style="max-width:560px;margin:0 auto;padding:32px 16px;">
      <div style="background:#f7f3ea;border:1px solid #c9a24b;border-radius:16px;padding:32px;">
        <p style="margin:0 0 8px;font-size:11px;letter-spacing:2px;color:#8a6a24;text-transform:uppercase;">Global Hukukçular Derneği</p>
        <h1 style="margin:0 0 16px;font-family:Georgia,serif;font-size:26px;">GH Dil</h1>
        <p style="margin:0 0 12px;font-size:15px;">{{ greeting }}</p>
        <p style="margin:0 0 24px;font-size:14px;line-height:1.7;color:#43506a;">{{ body }}</p>
        <a href="{{ url }}" style="display:inline-block;background:#0f1e3d;color:#f7f3ea;text-decoration:none;padding:13px 24px;border-radius:999px;font-size:14px;font-weight:bold;">{{ button }}</a>
        <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#68738a;">{{ footer }}</p>
      </div>
    </div>
  </body>
</html>
